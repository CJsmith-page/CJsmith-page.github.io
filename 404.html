<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Cudjoe John Smith</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0D1524; color: #EEF2F8; font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 36px; margin: 0 0 12px; }
    p { color: #A7B2C6; font-size: 18px; margin: 0 0 24px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 20px; border-radius: 8px; background: #2E62CC; color: #fff; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>The page you're looking for has moved or doesn't exist.</p>
    <a id="home" href="/">Go to the homepage</a>
  </div>
  <script>
    // On a project site (username.github.io/repository/), send visitors to the repository's homepage.
    var segs = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io') && segs.length && location.hostname.split('.')[0] !== segs[0]) {
      var known = ['experience', 'analysis', 'assets'];
      if (known.indexOf(segs[0]) === -1) document.getElementById('home').href = '/' + segs[0] + '/';
    }
  </script>
</body>
</html>
